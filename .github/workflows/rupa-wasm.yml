# Builds the रूपनिर्माणम् form engine (engine/rupa-wasm → WebAssembly) and commits the result to
# app/public/vidyut/ (rupa_wasm.js, rupa_wasm_bg.wasm). Runs when the engine changes, or by hand
# (Actions → "Build rūpa engine" → Run workflow). After it finishes: git pull, then npm run build.
name: Build rūpa engine

on:
  push:
    branches: [main]
    paths: ["engine/rupa-wasm/**", ".github/workflows/rupa-wasm.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Compile the engine
        working-directory: engine/rupa-wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generate the JavaScript bindings
        working-directory: engine/rupa-wasm
        run: |
          V=$(cargo pkgid -p wasm-bindgen | sed 's/.*[@#]//')
          echo "wasm-bindgen $V"
          cargo install wasm-bindgen-cli --version "$V" --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/rupa_wasm.wasm \
            --target web --out-dir ../../app/public/vidyut --out-name rupa_wasm --no-typescript
          ls -la ../../app/public/vidyut

      - name: Commit the built engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/vidyut/rupa_wasm.js app/public/vidyut/rupa_wasm_bg.wasm
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Build rūpa engine (WebAssembly)"
          git push
