[package]
name = "rupa-wasm"
version = "0.1.0"
edition = "2021"
description = "Form generator for samskritam.medhaa.net (wraps vidyut-prakriya)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# vidyut-prakriya at the revision used for all data on the site (Nov 2026)
vidyut-prakriya = { git = "https://github.com/ambuda-org/vidyut", rev = "2a802d0b6cfba5839f0a62cec174da1e58771ef8" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
